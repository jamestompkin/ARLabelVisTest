[project]
name = "arlabelvis"
version = "0.1.0"
description = "Smoothing color spaces for AR label color selection. Yang-Maccini senior thesis + IEEE VIS 2026 short paper."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core numerical stack
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    # Geometry / meshing
    "pyvista>=0.44",
    "trimesh>=4.0",
    "open3d>=0.18",
    "scikit-image>=0.22",
    "alphashape>=1.3",
    # PyTorch is used by utils/mesh_optimization.py for Mode.SMOOTH_MESH=="pytorch"
    # CPU wheel by default; to use CUDA, install torch from the PyTorch index:
    #   uv pip install --index-url https://download.pytorch.org/whl/cu121 torch
    "torch>=2.0",
    # Scene / video I/O (for the Python scene processor replacing Unity)
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "opencv-python>=4.9",
]

[tool.uv]
package = false
