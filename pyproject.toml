[project]
name = "arlabelvis"
version = "0.1.0"
description = "Smoothing color spaces for AR label color selection. Yang-Maccini senior thesis + IEEE VIS 2026 short paper."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core numerical stack
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    # Geometry / meshing
    "pyvista>=0.44",
    "trimesh>=4.0",
    "open3d>=0.18",
    "scikit-image>=0.22",
    "alphashape>=1.3",
    # PyTorch — fetched from the official PyTorch CUDA 12.1 wheel index for GPU
    # acceleration on NVIDIA GPUs (RTX 30xx/40xx). Falls back gracefully to CPU
    # if no CUDA device is present at runtime.
    "torch>=2.0,<2.3",
    # Scene / video I/O (for the Python scene processor replacing Unity)
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pymeshlab>=2025.7.post1",
    "threadpoolctl>=3.6.0",
    "pypardiso>=0.4.7",
    "cholespy>=2.2.0",
    "pillow>=12.2.0",
]

[tool.uv]
package = false
override-dependencies = [
    "mkl; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
